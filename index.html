<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="theme-color" content="#0f172a" />

  <title>AutoLink — ควบคุมประตู</title>

  <link rel="stylesheet" href="css/tokens.css" />

  <link rel="stylesheet" href="css/base.css" />

  <link rel="stylesheet" href="css/gate.css" />

  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/themes.css" />

</head>

<body>

  <div id="alApp" class="al-app">

    <header class="al-topbar">

      <div class="al-brand">
        <h1 class="al-title">AutoLink</h1>
        <p class="al-subtitle" id="alReadyHint">กำลังโหลด…</p>
      </div>

      <div class="al-device-selector-wrap" id="alDeviceSelectorWrap" style="margin-left:auto; margin-right:12px;" hidden>
        <select id="alDeviceSelect" style="padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); font-size: 14px; outline: none; max-width: 150px; cursor: pointer;"></select>
      </div>

      <button type="button" class="al-setup-toggle" id="alSetupToggle" aria-expanded="false" aria-controls="alSetup" title="ตั้งค่า Skin" hidden>⚙</button>

    </header>




    <div id="alNeedConfig" class="al-need-config" hidden>

      <p class="al-need-config__lead">เชื่อมต่อครั้งแรก — ใส่ Blynk Auth Token แล้วกดปุ่มด้านล่าง</p>

      <form id="alConnectForm" class="al-connect-form" autocomplete="off">

        <label class="al-field">

          <span>Blynk Auth Token</span>

          <input id="alConnectToken" name="token" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" required minlength="8" />

        </label>

        <label class="al-field">

          <span>Server (ไม่บังคับ)</span>

          <input id="alConnectHost" name="host" type="text" spellcheck="false" placeholder="sgp1.blynk.cloud" />

        </label>

        <button type="submit" class="al-btn al-btn--primary al-connect-submit">เริ่มใช้งาน</button>

        <p class="al-setup-msg" id="alConnectMsg" role="status"></p>

      </form>

      <p class="al-need-config__hint">หา Token ที่ <a href="https://blynk.cloud/" target="_blank" rel="noopener noreferrer">blynk.cloud</a> → Device → Auth Token · หรือเปิดจาก <strong>AutoLink</strong> (ตั้งค่า → AutoLink → เปิด AutoLink) เพื่อตั้งค่าอัตโนมัติ</p>

    </div>



    <aside id="alSetup" class="al-setup al-setup--skin" hidden>

      <h2 class="al-setup-title">ตั้งค่า Skin</h2>

      <form id="alSetupForm" class="al-setup-form" autocomplete="off">

        <label class="al-field">

          <span>รูปแบบหน้าจอ</span>

          <select id="alSkinSelect" name="skin"></select>

        </label>

        <div class="al-setup-actions al-setup-actions--row">
          <button type="button" class="al-btn al-btn--sec" id="alSetupCancel">ยกเลิก</button>
          <button type="submit" class="al-btn al-btn--primary">บันทึก</button>
        </div>

        <p class="al-setup-msg" id="alSetupMsg" role="status"></p>

        <div style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.1); padding-top:16px;">
          <button type="button" class="al-btn" id="alDeleteDevice" style="background:#ef4444; color:white; border:none; width:100%; font-size:14px; padding:10px; border-radius:6px; cursor:pointer;">ลบอุปกรณ์นี้ออกจากรายการ</button>
        </div>

      </form>

    </aside>




    <main id="alSkinHost" class="al-skin-host" data-al-skin-active="classic"></main>

  </div>



  <script src="js/deploy-config.js"></script>

  <script src="js/skins-registry.js"></script>

  <script src="js/config-store.js"></script>

  <script src="js/webhook.js"></script>

  <script src="js/gate-controller.js"></script>

  <script src="js/skin-engine.js"></script>

  <script src="js/app.js"></script>

</body>

</html>
